<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>zhupi DOM tests</title></head>
<body>
<!-- DOM 层测试：跑在真 Chrome 里（不引 jsdom）。测的是渲染行号规则与锚定几何——
     M2 锚定的全部精度都建立在这两块上，改渲染器最容易在这里悄悄坏掉。
     由 test/run-dom.sh 以 headless 方式执行，结果打印成 [dom] 行、失败非零退出。 -->
<div id="stage"></div>
<script src="../vendor/markdown-it.min.js"></script>
<script type="module">
import { renderMarkdown } from '../src/render.js';
import { computeAnchor, rangeForDraft, rangeFromTextOffset, sectionOf } from '../src/anchor.js';

let pass = 0, fail = 0;
const eq = (name, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  console.log(`[dom] ${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : ` — got ${JSON.stringify(got)} want ${JSON.stringify(want)}`}`);
};
const ok_ = (name, cond, detail = '') => eq(name, Boolean(cond) ? true : `false ${detail}`, true);

const stage = document.getElementById('stage');
const MD = [
  '# 标题一',                       // 1
  '',                               // 2
  '第一段正文，含**加粗**与`代码`。', // 3
  '',                               // 4
  '## 标题二',                       // 5
  '',                               // 6
  '| a | b |',                      // 7
  '|---|---|',                      // 8
  '| 行一 | x |',                   // 9
  '| 行二 | y |',                   // 10
  '',                               // 11
  '```js',                          // 12
  'const a = 1;',                   // 13
  'const b = 2;',                   // 14
  'const c = 3;',                   // 15
  '```',                            // 16
  '',                               // 17
  '- 列表项甲',                      // 18
  '- 列表项乙',                      // 19
  '',                               // 20
  '隔开列表的一段话。',              // 21 ← 必须隔开：列表后紧跟的 4 空格缩进块
  '',                               // 22   会被 CommonMark 吸进列表当续段，不成代码块
  '    缩进代码行一',                // 23
  '    缩进代码行二',                // 24
].join('\n');

stage.innerHTML = renderMarkdown(MD);

// ── 1. 渲染器行号规则（锚定的地基）──
const line = (sel) => { const el = stage.querySelector(sel); return el ? +el.dataset.line : null; };
eq('h1 行号', line('h1'), 1);
eq('段落行号', line('p'), 3);
eq('h2 行号', line('h2'), 5);
eq('table 行号', line('table'), 7);
eq('表格 tr 有独立行号（缺它则批表格只能锚到整表首行）', line('tbody tr'), 9);
eq('第二个表格行独立成行', +stage.querySelectorAll('tbody tr')[1].dataset.line, 10);
eq('fence 行号落在 <code> 上且指向 ``` 行', line('pre > code[data-line]'), 12);
eq('缩进代码块行号落在 <pre> 上且是首行', line('pre[data-line]'), 23);
eq('列表项行号', line('li'), 18);
ok_('块级元素带 data-line-end', stage.querySelector('h1').dataset.lineEnd === '1');

// ── 2. 选区 → 锚（computeAnchor 的行号数学）──
function selectText(root, text) {
  for (const block of root.querySelectorAll('[data-line]')) {
    const idx = block.textContent.indexOf(text);
    if (idx < 0) continue;
    const r = rangeFromTextOffset(block, idx, text.length);
    if (!r) continue;
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    return r;
  }
  return null;
}

selectText(stage, '第一段正文');
eq('段落内划选 → 段落行号', computeAnchor(stage)?.line, 3);

selectText(stage, 'const b = 2;');
eq('fence 内第二行代码 → 精确到该行（fence 首行 +1 +换行数）', computeAnchor(stage)?.line, 14);

selectText(stage, 'const a = 1;');
eq('fence 内第一行代码', computeAnchor(stage)?.line, 13);

selectText(stage, '缩进代码行二');
eq('缩进代码块第二行 → 精确到该行（+0 偏移）', computeAnchor(stage)?.line, 24);

selectText(stage, '行二');
eq('表格第二行划选 → 该行行号', computeAnchor(stage)?.line, 10);

selectText(stage, '加粗');
const boldAnchor = computeAnchor(stage);
eq('划中内联格式内的字仍锚到源行（文本搜索会失败，DOM 主锚不会）', boldAnchor?.line, 3);
ok_('引文取渲染文本（不含 markdown 记号）', boldAnchor?.quote === '加粗');

getSelection().removeAllRanges();
eq('无选区 → 不产生锚', computeAnchor(stage), null);

// ── 3. 高亮定位与撞词偏移 ──
stage.innerHTML = renderMarkdown('句子甲。重复短语。句子乙。重复短语。句子丙。');
const block = stage.querySelector('p');
const full = block.textContent;
const firstIdx = full.indexOf('重复短语');
const secondIdx = full.indexOf('重复短语', firstIdx + 1);
const rFirst = rangeForDraft(stage, { blockLine: 1, quoteRaw: '重复短语', offset: firstIdx });
const rSecond = rangeForDraft(stage, { blockLine: 1, quoteRaw: '重复短语', offset: secondIdx });
ok_('撞词：按块内偏移定位到第二处而非永远第一处',
  rFirst && rSecond && rFirst.startOffset !== rSecond.startOffset,
  `first=${rFirst?.startOffset} second=${rSecond?.startOffset}`);
eq('引文不存在时返回 null（不乱画高亮）',
  rangeForDraft(stage, { blockLine: 1, quoteRaw: '根本没有这句', offset: 0 }), null);

// ── 4. sectionOf：批注卡上的出处 ──
stage.innerHTML = renderMarkdown(MD);
eq('取该行之前最近的标题', sectionOf(stage, 9), '标题二');
eq('第一节之内取 h1', sectionOf(stage, 3), '标题一');

// ── 5. 标题 id：页内锚点 `[…](#slug)` 的落点 ──
// 钉的是「与 GitHub 口径相同」，不是「我们自己算得出一个 id」——同一份 markdown 两处都要能跳。
stage.innerHTML = renderMarkdown([
  '# 标题一',
  '',
  '## 加长段（冒烟用，别删）',
  '',
  '## 带 [外链](https://example.com/x) 的标题',
  '',
  '## 小结',
  '',
  '## 小结',
].join('\n'));
const hIds = [...stage.querySelectorAll('h1[id],h2[id]')].map((h) => h.id);
eq('标题按 GitHub 口径打 id（CJK 标点全去掉）', hIds.slice(0, 2), ['标题一', '加长段冒烟用别删']);
eq('标题里的链接只取可见文字，不把 URL 算进 slug', hIds[2], '带-外链-的标题');
eq('同名标题去重（第二个追加 -1）', hIds.slice(3), ['小结', '小结-1']);
ok_('id 与 data-line 并存（涂归的锚不能被页内锚顶掉）',
  stage.querySelector('h1').dataset.line === '1' && stage.querySelector('h1').id === '标题一',
  `line=${stage.querySelector('h1').dataset.line} id=${stage.querySelector('h1').id}`);

stage.innerHTML = renderMarkdown('见 [[#某节]]，以及 [[别篇#某节]]。');
const wHrefs = [...stage.querySelectorAll('a.wikilink')].map((a) => a.getAttribute('href'));
eq('双链只给锚＝本篇内跳转（不拼成 .md#…那种死链）', decodeURIComponent(wHrefs[0] ?? ''), '#某节');
eq('双链带文件名时仍是「文件 + 锚」', decodeURI(wHrefs[1] ?? ''), '别篇.md#某节');

console.log(`[dom] RESULT pass=${pass} fail=${fail}`);
</script>
</body>
</html>
